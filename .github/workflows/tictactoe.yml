name: Tic-Tac-Toe Bot Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  tictactoe:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'tictactoe|')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tic-Tac-Toe Bot Engine
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python scripts/tictactoe_bot.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "game: move played by @${{ github.actor }}"
          git push

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "🎮 Move processed! Check out the updated board on the profile README!"
