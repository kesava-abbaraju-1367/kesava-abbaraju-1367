name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ vars.USER_NAME }}
          USER_BIRTHDAY: ${{ vars.USER_BIRTHDAY }}
        run: python today.py

      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@github.com"
          git config --global user.name "GitHub-Actions-Bot"
          git commit -m "Updated README Stats" -a || echo "No changes to commit"
          git push
